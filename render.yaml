services:
  - type: web
    name: ciso-assistant-api-sowaisum
    runtime: docker
    plan: starter
    branch: codex/vercel-deployment-v3.18.2
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health/
    envVars:
      - fromGroup: ciso-assistant-runtime
      - key: CISO_ASSISTANT_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: ciso-assistant-api-sowaisum.onrender.com
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: POSTGRES_NAME
        fromDatabase:
          name: ciso-assistant-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: ciso-assistant-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: ciso-assistant-postgres
          property: password
      - key: DB_HOST
        fromDatabase:
          name: ciso-assistant-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ciso-assistant-postgres
          property: port

  - type: worker
    name: ciso-assistant-huey-sowaisum
    runtime: docker
    plan: starter
    branch: codex/vercel-deployment-v3.18.2
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - fromGroup: ciso-assistant-runtime
      - key: PROCESS_ROLE
        value: worker
      - key: CISO_ASSISTANT_URL
        fromService:
          name: ciso-assistant-api-sowaisum
          type: web
          envVarKey: CISO_ASSISTANT_URL
      - key: POSTGRES_NAME
        fromDatabase:
          name: ciso-assistant-postgres
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: ciso-assistant-postgres
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: ciso-assistant-postgres
          property: password
      - key: DB_HOST
        fromDatabase:
          name: ciso-assistant-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ciso-assistant-postgres
          property: port

databases:
  - name: ciso-assistant-postgres
    plan: basic-256mb
    databaseName: ciso_assistant
    user: ciso_assistant
    ipAllowList: []

envVarGroups:
  - name: ciso-assistant-runtime
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: ENABLE_SANDBOX
        value: "True"
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_FORMAT
        value: json
      - key: GUNICORN_WORKERS
        value: "2"
